<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="danger" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#451a1a"/>
      <stop offset="100%" style="stop-color:#7f1d1d"/>
    </linearGradient>
    <linearGradient id="safe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
  </defs>
  <rect width="820" height="240" rx="12" fill="url(#bg2)" stroke="#334155" stroke-width="1"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Where does plaintext live?</text>

  <!-- Left: Without Safe Edit -->
  <g>
    <rect x="24" y="48" width="380" height="176" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="214" y="76" text-anchor="middle" fill="#f87171" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Without Safe Edit</text>
    <text x="214" y="94" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">unlock - edit .env - import - lock</text>

    <!-- Disk icon + .env -->
    <rect x="52" y="112" width="160" height="92" rx="8" fill="url(#danger)" stroke="#b91c1c" stroke-width="1" opacity="0.8"/>
    <text x="132" y="138" text-anchor="middle" fill="#fecaca" font-family="ui-monospace, monospace" font-size="12">.env</text>
    <text x="132" y="156" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="10">plaintext</text>
    <text x="132" y="172" text-anchor="middle" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="10">on disk</text>
    <text x="132" y="192" text-anchor="middle" fill="#ef4444" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">while you edit</text>

    <!-- .env.up -->
    <rect x="228" y="112" width="160" height="92" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="308" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">.env.up</text>
    <text x="308" y="156" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">encrypted</text>
    <text x="308" y="192" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">safe to commit</text>

    <path d="M 212 158 L 222 158" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="217" y="152" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">import</text>
  </g>

  <!-- Right: With Safe Edit -->
  <g>
    <rect x="416" y="48" width="380" height="176" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="606" y="76" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">With Safe Edit</text>
    <text x="606" y="94" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Edit with DotEnvUp - edit - save</text>

    <!-- Memory (editor) -->
    <rect x="444" y="112" width="160" height="92" rx="8" fill="url(#safe)" stroke="#22c55e" stroke-width="1" opacity="0.9"/>
    <text x="524" y="138" text-anchor="middle" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">Editor buffer</text>
    <text x="524" y="156" text-anchor="middle" fill="#86efac" font-family="ui-monospace, monospace" font-size="10">plaintext</text>
    <text x="524" y="172" text-anchor="middle" fill="#86efac" font-family="ui-monospace, monospace" font-size="10">in memory only</text>
    <text x="524" y="192" text-anchor="middle" fill="#4ade80" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">never on disk</text>

    <!-- .env.up only on disk -->
    <rect x="620" y="112" width="160" height="92" rx="8" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="700" y="138" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">.env.up</text>
    <text x="700" y="156" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">encrypted</text>
    <text x="700" y="172" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">on disk</text>
    <text x="700" y="192" text-anchor="middle" fill="#22c55e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9">only file on disk</text>

    <path d="M 608 158 L 618 158" stroke="#6366f1" stroke-width="1.5"/>
    <text x="613" y="152" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="8">save</text>
  </g>

  <!-- VS divider -->
  <text x="410" y="138" text-anchor="middle" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700">vs</text>
</svg>
