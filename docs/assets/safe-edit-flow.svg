<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" width="820" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="820" height="280" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1"/>
  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Safe Edit - edit in place, plaintext never on disk</text>

  <!-- Flow boxes -->
  <!-- 1. .env.up on disk -->
  <g>
    <rect x="24" y="56" width="120" height="72" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="84" y="82" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">.env.up</text>
    <text x="84" y="98" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">(on disk)</text>
    <rect x="32" y="108" width="104" height="12" rx="2" fill="#334155"/>
    <text x="84" y="117" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">encrypted</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 148 92 L 198 92" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="173" y="82" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9">read</text>

  <!-- 2. Decrypt -->
  <g>
    <rect x="202" y="56" width="100" height="72" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.9"/>
    <text x="252" y="82" text-anchor="middle" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="11">decrypt</text>
    <text x="252" y="98" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9">(memory)</text>
    <text x="252" y="118" text-anchor="middle" fill="#818cf8" font-family="ui-monospace, monospace" font-size="8">keystore</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 306 92 L 356 92" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="331" y="82" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9">-&gt; editor</text>

  <!-- 3. Editor (virtual doc) -->
  <g>
    <rect x="360" y="44" width="100" height="96" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="410" y="68" text-anchor="middle" fill="#86efac" font-family="ui-monospace, monospace" font-size="11">Editor</text>
    <text x="410" y="84" text-anchor="middle" fill="#4ade80" font-family="ui-monospace, monospace" font-size="9">(virtual doc)</text>
    <line x1="372" y1="92" x2="448" y2="92" stroke="#334155" stroke-width="1"/>
    <text x="410" y="106" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">API_KEY=sk-...</text>
    <text x="410" y="118" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">DB_URL=postgres://</text>
    <text x="410" y="132" text-anchor="middle" fill="#22c55e" font-family="ui-monospace, monospace" font-size="8">plaintext in memory</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 464 92 L 514 92" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="489" y="82" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9">save</text>

  <!-- 4. Encrypt -->
  <g>
    <rect x="518" y="56" width="100" height="72" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.9"/>
    <text x="568" y="82" text-anchor="middle" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="11">encrypt</text>
    <text x="568" y="98" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9">(memory)</text>
    <text x="568" y="118" text-anchor="middle" fill="#818cf8" font-family="ui-monospace, monospace" font-size="8">keystore</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 622 92 L 672 92" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="647" y="82" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9">write</text>

  <!-- 5. .env.up updated -->
  <g>
    <rect x="676" y="56" width="120" height="72" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="736" y="82" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">.env.up</text>
    <text x="736" y="98" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">(on disk)</text>
    <rect x="684" y="108" width="104" height="12" rx="2" fill="#334155"/>
    <text x="736" y="117" text-anchor="middle" fill="#64748b" font-family="ui-monospace, monospace" font-size="8">encrypted</text>
  </g>

  <!-- Bottom caption -->
  <rect x="24" y="200" width="772" height="64" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="410" y="228" text-anchor="middle" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Right-click .env.up - Edit with DotEnvUp - Edit in the virtual doc - Cmd+S saves back to .env.up only. No .env file is ever created.</text>
  <text x="410" y="248" text-anchor="middle" fill="#6366f1" font-family="ui-monospace, monospace" font-size="11">dotenvup-safe:/.env.up.edit - decrypt on read, encrypt on save</text>
</svg>
