<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980">
  <defs>
    <style><![CDATA[
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .title { font-size: 20px; font-weight: 700; }
      .subtitle { font-size: 12px; fill: #9ca3af; }
      .h2 { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #c4b5fd; }
      .btn { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .btn-secondary { font-size: 12px; font-weight: 600; fill: #d1d5db; }
      .tiny { font-size: 10px; fill: #9ca3af; }
      .warn { font-size: 11px; fill: #fbbf24; }
      .ok { font-size: 11px; fill: #86efac; }
      .label { font-size: 10px; fill: #fda4af; font-style: italic; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#0f172a"/>
  <text x="24" y="32" class="title">DotEnvUp - Touch ID / Apple password setup</text>
  <text x="24" y="52" class="subtitle">States: biometry available (opt-in), no Touch ID (password fallback), declined | Surfaces: Extension UI + Cursor plugin MCP/skill</text>

  <!-- State A: biometry available -->
  <rect x="24" y="76" width="440" height="520" rx="10" fill="#111827" stroke="#334155"/>
  <text x="40" y="98" class="label">A - macOS with Touch ID / Apple Watch</text>
  <rect x="24" y="108" width="440" height="52" rx="10" fill="#1f2937"/>
  <text x="44" y="139" class="title">Protect with Touch ID</text>

  <rect x="40" y="180" width="408" height="200" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="56" y="208" class="h2">What you get</text>
  <text x="56" y="232" class="body">- Private key wrapped; Keychain holds wrapping key</text>
  <text x="56" y="252" class="body">- Unlock with Touch ID or Apple Watch</text>
  <text x="56" y="272" class="body">- Fallback: your Mac login password</text>
  <text x="56" y="292" class="body">- One prompt per session (30m idle / 8h max)</text>
  <text x="56" y="320" class="mono">identity.enc + Keychain (UserPresence)</text>
  <text x="56" y="348" class="ok">Recovery code is generated next - save it.</text>

  <rect x="40" y="400" width="200" height="36" rx="6" fill="#4f46e5"/>
  <text x="140" y="423" text-anchor="middle" class="btn">Enable Touch ID</text>
  <rect x="256" y="400" width="160" height="36" rx="6" fill="#334155"/>
  <text x="336" y="423" text-anchor="middle" class="btn-secondary">Keep file key</text>
  <text x="40" y="460" class="tiny">Shown from extension first-protect / Key Management, or after Cursor plugin suggests up key migrate-to-keychain.</text>
  <text x="40" y="500" class="tiny">Cursor plugin cannot show OS prompt itself; CLI/helper triggers LocalAuthentication.</text>
  <text x="40" y="540" class="tiny">Agents: warm session via up unlock / MCP - no per-command prompt.</text>

  <!-- State B: no biometry -->
  <rect x="484" y="76" width="440" height="520" rx="10" fill="#111827" stroke="#334155"/>
  <text x="500" y="98" class="label">B - No Touch ID hardware</text>
  <rect x="484" y="108" width="440" height="52" rx="10" fill="#1f2937"/>
  <text x="504" y="139" class="title">Protect with Mac password</text>

  <rect x="500" y="180" width="408" height="180" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="516" y="208" class="h2">Still Keychain-backed</text>
  <text x="516" y="232" class="body">UserPresence falls back to login password.</text>
  <text x="516" y="252" class="body">Same envelope + recovery code flow.</text>
  <text x="516" y="272" class="warn">Not the Passwords.app website vault -</text>
  <text x="516" y="292" class="warn">macOS Keychain + system auth dialog.</text>
  <text x="516" y="324" class="mono">kSecAccessControlUserPresence</text>

  <rect x="500" y="400" width="220" height="36" rx="6" fill="#4f46e5"/>
  <text x="610" y="423" text-anchor="middle" class="btn">Enable Keychain protect</text>
  <rect x="736" y="400" width="140" height="36" rx="6" fill="#334155"/>
  <text x="806" y="423" text-anchor="middle" class="btn-secondary">Not now</text>

  <!-- State C: declined -->
  <rect x="944" y="76" width="432" height="520" rx="10" fill="#111827" stroke="#334155"/>
  <text x="960" y="98" class="label">C - Declined / stay on file</text>
  <rect x="944" y="108" width="432" height="52" rx="10" fill="#1f2937"/>
  <text x="964" y="139" class="title">File identity kept</text>

  <rect x="960" y="180" width="400" height="160" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="976" y="208" class="h2">Storage mode: user-file</text>
  <text x="976" y="232" class="mono">~/.dotenvup/identity</text>
  <text x="976" y="260" class="body">You can enable Keychain later from</text>
  <text x="976" y="280" class="body">Key Management or:</text>
  <text x="976" y="308" class="mono">up key migrate-to-keychain</text>

  <rect x="960" y="400" width="180" height="36" rx="6" fill="#334155"/>
  <text x="1050" y="423" text-anchor="middle" class="btn-secondary">Continue</text>

  <!-- Delivery surfaces -->
  <rect x="24" y="620" width="1352" height="336" rx="10" fill="#111827" stroke="#334155"/>
  <text x="40" y="648" class="label">Delivery surfaces in Cursor</text>
  <text x="40" y="680" class="h2">1. Cursor Marketplace plugin (skill + MCP)</text>
  <text x="40" y="704" class="body">Skill teaches: unlock session once, then up run -- / MCP. Bundles @dotenvup/mcp so agents never assume .env and never hang on biometry.</text>
  <text x="40" y="732" class="h2">2. VS Code/Cursor extension (human UI)</text>
  <text x="40" y="756" class="body">Status bar + Key Management show Enable Touch ID, recovery code screen, session countdown. Same Key-Id as CLI.</text>
  <text x="40" y="784" class="h2">3. CLI helper (actual Keychain ACL)</text>
  <text x="40" y="808" class="body">Signed Swift helper prompts LocalAuthentication. Plugin and extension call into this - they do not reimplement crypto.</text>
  <text x="40" y="848" class="tiny">Implementation note: do not store live private key only in Cursor SecretStorage. Shared Keychain + identity.enc only.</text>
  <text x="40" y="876" class="tiny">Wireframe approval gate before M1 code. See docs/design/KEYCHAIN_TOUCHID.md.</text>
</svg>
