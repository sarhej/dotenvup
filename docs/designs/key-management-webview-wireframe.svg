<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980">
  <defs>
    <style><![CDATA[
      text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .title { font-size: 20px; font-weight: 700; }
      .subtitle { font-size: 12px; fill: #9ca3af; }
      .h2 { font-size: 14px; font-weight: 700; }
      .body { font-size: 12px; }
      .mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; fill: #c4b5fd; }
      .btn { font-size: 12px; font-weight: 600; fill: #ffffff; }
      .btn-secondary { font-size: 12px; font-weight: 600; fill: #d1d5db; }
      .tiny { font-size: 10px; fill: #9ca3af; }
      .warn { font-size: 11px; fill: #fbbf24; }
      .ok { font-size: 11px; fill: #86efac; }
      .label { font-size: 10px; fill: #fda4af; font-style: italic; }
    ]]></style>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#0f172a"/>

  <text x="24" y="32" class="title">DotEnvUp - Key Management Webview Wireframe</text>
  <text x="24" y="52" class="subtitle">States: desktop default, desktop empty/error, mobile compact, export confirm modal</text>

  <!-- Desktop: default -->
  <rect x="24" y="76" width="860" height="520" rx="10" fill="#111827" stroke="#334155"/>
  <text x="40" y="98" class="label">Desktop default state</text>
  <rect x="24" y="108" width="860" height="52" rx="10" fill="#1f2937"/>
  <text x="44" y="139" class="title">Key Management</text>
  <text x="252" y="139" class="subtitle">Local identities, backup, restore, and recipient discovery</text>

  <rect x="40" y="176" width="396" height="170" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="56" y="200" class="h2">Current Identity</text>
  <text x="56" y="224" class="body">Storage mode: user-file</text>
  <text x="56" y="244" class="body">Identity dir:</text>
  <text x="56" y="262" class="mono">~/.dotenvup/identity</text>
  <text x="56" y="286" class="body">Key-Id:</text>
  <text x="56" y="304" class="mono">pBEsFwUPu2Q</text>
  <text x="56" y="328" class="ok">Private key is present and readable</text>

  <rect x="448" y="176" width="420" height="170" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="464" y="200" class="h2">Actions</text>
  <rect x="464" y="218" width="124" height="34" rx="6" fill="#4f46e5"/>
  <text x="526" y="239" text-anchor="middle" class="btn">Export Key</text>
  <rect x="600" y="218" width="124" height="34" rx="6" fill="#4f46e5"/>
  <text x="662" y="239" text-anchor="middle" class="btn">Import Key</text>
  <rect x="736" y="218" width="124" height="34" rx="6" fill="#334155"/>
  <text x="798" y="239" text-anchor="middle" class="btn-secondary">Open Folder</text>
  <rect x="464" y="262" width="124" height="34" rx="6" fill="#334155"/>
  <text x="526" y="283" text-anchor="middle" class="btn-secondary">Refresh</text>
  <text x="464" y="324" class="tiny">No key material is displayed. Only fingerprint and paths.</text>

  <rect x="40" y="360" width="828" height="220" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="56" y="384" class="h2">Local Key Inventory (read-only)</text>
  <text x="56" y="404" class="subtitle">Sources: ~/.dotenvup, workspace root, Desktop/Documents/Downloads, optional deep scan</text>

  <rect x="56" y="418" width="796" height="32" rx="4" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="438" class="body">identity-public</text>
  <text x="214" y="438" class="mono">pBEsFwUPu2Q</text>
  <text x="356" y="438" class="tiny">~/.dotenvup/identity.pub</text>
  <text x="810" y="438" class="ok">MATCH</text>

  <rect x="56" y="456" width="796" height="32" rx="4" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="476" class="body">key-bundle</text>
  <text x="214" y="476" class="mono">vT3c0rN6mLw</text>
  <text x="356" y="476" class="tiny">~/Downloads/alice-backup.dotenvup-key</text>
  <text x="810" y="476" class="body">candidate</text>

  <rect x="56" y="494" width="796" height="32" rx="4" fill="#0f172a" stroke="#374151"/>
  <text x="70" y="514" class="body">public-key</text>
  <text x="214" y="514" class="mono">Xj9sA2kQd8M</text>
  <text x="356" y="514" class="tiny">./team/bob.pub</text>
  <text x="810" y="514" class="body">candidate</text>

  <text x="56" y="548" class="tiny">Optional row action in future: "Add as project recipient"</text>

  <!-- Desktop: empty/error -->
  <rect x="908" y="76" width="468" height="520" rx="10" fill="#111827" stroke="#334155"/>
  <text x="924" y="98" class="label">Desktop empty/error state</text>
  <rect x="908" y="108" width="468" height="52" rx="10" fill="#1f2937"/>
  <text x="928" y="139" class="title">Key Management</text>

  <rect x="924" y="176" width="436" height="126" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="940" y="200" class="h2">Current Identity</text>
  <text x="940" y="224" class="warn">No local keypair found</text>
  <text x="940" y="246" class="body">Run "DotEnvUp: Init" or import a key bundle to continue.</text>
  <rect x="940" y="260" width="140" height="30" rx="6" fill="#4f46e5"/>
  <text x="1010" y="279" text-anchor="middle" class="btn">Import Key</text>

  <rect x="924" y="316" width="436" height="186" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="940" y="340" class="h2">Local Key Inventory</text>
  <text x="940" y="364" class="warn">Scan failed: permission denied for ~/Library/...</text>
  <text x="940" y="386" class="body">Retry with quick scan or pick explicit folder.</text>
  <rect x="940" y="404" width="118" height="30" rx="6" fill="#334155"/>
  <text x="999" y="423" text-anchor="middle" class="btn-secondary">Quick Scan</text>
  <rect x="1070" y="404" width="118" height="30" rx="6" fill="#334155"/>
  <text x="1129" y="423" text-anchor="middle" class="btn-secondary">Deep Scan</text>

  <!-- Mobile compact -->
  <rect x="24" y="620" width="340" height="336" rx="10" fill="#111827" stroke="#334155"/>
  <text x="40" y="642" class="label">Mobile/compact panel</text>
  <rect x="24" y="654" width="340" height="46" rx="10" fill="#1f2937"/>
  <text x="40" y="683" class="h2">Key Management</text>

  <rect x="40" y="714" width="308" height="94" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="52" y="736" class="body">Key-Id: pBEsFwUPu2Q</text>
  <text x="52" y="756" class="mono">~/.dotenvup/identity</text>
  <rect x="52" y="770" width="90" height="26" rx="6" fill="#4f46e5"/>
  <text x="97" y="787" text-anchor="middle" class="btn">Export</text>
  <rect x="150" y="770" width="90" height="26" rx="6" fill="#4f46e5"/>
  <text x="195" y="787" text-anchor="middle" class="btn">Import</text>

  <rect x="40" y="820" width="308" height="120" rx="8" fill="#1f2937" stroke="#374151"/>
  <text x="52" y="842" class="body">Inventory:</text>
  <text x="52" y="862" class="tiny">identity.pub - pBEsFwUPu2Q</text>
  <text x="52" y="880" class="tiny">alice-backup.dotenvup-key - vT3c0rN6mLw</text>
  <rect x="52" y="892" width="92" height="26" rx="6" fill="#334155"/>
  <text x="98" y="909" text-anchor="middle" class="btn-secondary">Refresh</text>

  <!-- Export confirmation modal -->
  <rect x="392" y="620" width="984" height="336" rx="10" fill="#111827" stroke="#334155"/>
  <text x="408" y="642" class="label">Export confirmation modal state</text>
  <rect x="744" y="700" width="280" height="180" rx="10" fill="#1f2937" stroke="#4b5563"/>
  <text x="764" y="730" class="h2">Export key bundle</text>
  <text x="764" y="752" class="body">Filename: dotenvup-key-2026-02-24.dotenvup-key</text>
  <text x="764" y="772" class="body">Passphrase: [ entered in secure input ]</text>
  <text x="764" y="794" class="warn">Store passphrase safely. Without it, restore fails.</text>
  <rect x="764" y="818" width="112" height="34" rx="6" fill="#334155"/>
  <text x="820" y="839" text-anchor="middle" class="btn-secondary">Cancel</text>
  <rect x="890" y="818" width="112" height="34" rx="6" fill="#4f46e5"/>
  <text x="946" y="839" text-anchor="middle" class="btn">Export</text>

  <text x="408" y="934" class="tiny">Implementation notes: use existing keyExport/keyImport commands backend; webview remains read-only for private key material.</text>
</svg>
