name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Swift helper only on macOS; skip codesign in CI (no Developer ID secrets yet)
      - name: Build keychain-darwin
        run: npm run build --workspace=@dotenvup/keychain-darwin
        env:
          DOTENVUP_CODESIGN: '0'

      - name: Build packages
        run: |
          npm run build --workspace=@dotenvup/format
          npm run build --workspace=@dotenvup/cli --workspace=@dotenvup/node --workspace=@dotenvup/mcp --workspace=@dotenvup/secret-generator --workspace=dotenvup

      - name: Test (Linux — xvfb for VS Code extension host)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (macOS)
        if: runner.os != 'Linux'
        run: npm test

      - name: Helper probe (macOS)
        if: runner.os == 'macOS'
        run: ./packages/keychain-darwin/bin/dotenvup-keychain probe

      - name: Remind manual Keychain/session checklist
        if: runner.os == 'macOS'
        run: |
          echo "Interactive Touch ID / lock-screen checks are manual."
          echo "See docs/design/KEYCHAIN_M3_MANUAL_TEST.md"
