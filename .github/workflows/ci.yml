name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      # Swift helper only on macOS; skip codesign in CI (no Developer ID secrets yet)
      - name: Build keychain-darwin
        run: npm run build --workspace=@dotenvup/keychain
        env:
          DOTENVUP_CODESIGN: '0'

      - name: Build packages
        run: |
          npm run build --workspace=@dotenvup/format
          npm run build --workspace=@dotenvup/cli --workspace=@dotenvup/node --workspace=@dotenvup/mcp --workspace=@dotenvup/secret-generator --workspace=dotenvup

      # Package tests (excludes vscode-dotenvup — @vscode/test-electron Electron path is flaky in CI)
      - name: Test packages
        run: npm test

      - name: Extension tests (best-effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run test:extension

      - name: Helper probe (macOS)
        if: runner.os == 'macOS'
        run: ./packages/keychain-darwin/bin/dotenvup-keychain probe

      - name: Remind manual Keychain/session checklist
        if: runner.os == 'macOS'
        run: |
          echo "Interactive Touch ID / lock-screen checks are manual."
          echo "See docs/design/KEYCHAIN_M3_MANUAL_TEST.md"
